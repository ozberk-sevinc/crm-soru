version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      expo-sdk:
        patterns: [expo*, react, react-native, react-native-*, '@types/react', typescript]
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
