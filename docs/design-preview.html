<div id="crm-soru-redesign-root" class="viz-dotted-background"></div>
<style>
#crm-soru-redesign-root{color-scheme:light dark;--sp-frame:light-dark(#E0E4DB,#384A3B);--sp-surface:light-dark(#FFFFFF,#1A2B22);--sp-ink:light-dark(#20382F,#F0F3E9);--sp-muted:light-dark(#657069,#B3BFB3);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px 8px;box-sizing:border-box;}
